[project]
name = "duka-autopilot"
version = "0.1.0"
description = "Duka Autopilot - the autonomous night shift for a Kenyan shop."
requires-python = ">=3.10"
dependencies = [
    "google-adk==2.7.1",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    # Cloud Run + Agent Platform managed Sessions/Memory Bank + Firestore.
    "google-cloud-aiplatform==1.165.1",
    "google-cloud-firestore==2.28.1",
    "google-cloud-pubsub==2.39.1",
    "google-auth==2.57.0",
    "grpcio==1.83.0",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
]

[project.optional-dependencies]
dev = [
    "google-adk[eval]==2.7.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pillow==12.3.0",
]
assets = [
    "google-genai==2.20.0",
    "google-cloud-texttospeech==2.37.0",
    "pillow==12.3.0",
]
# cloud screening layer on top of the local rules (see agents/screening.py)
armor = ["google-cloud-modelarmor>=0.2"]

[tool.setuptools]
packages = ["app", "agents", "agents.tools", "agents.store", "agents.synth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project]
name = "duka-autopilot"
version = "0.1.0"
description = "Duka Autopilot - the always-on AI back office for African SMEs. Event-driven orders, support and M-Pesa reconciliation with humans gating every shilling."
requires-python = ">=3.10"
dependencies = [
    "google-adk~=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    # cloud mode (Phase: deploy): Agent Engine client + Firestore store backend
    "google-cloud-aiplatform>=1.160",
    "google-cloud-firestore>=2.16",
    "google-cloud-pubsub>=2.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "pillow>=10.0"]

[tool.setuptools]
packages = ["app", "agents", "agents.tools", "agents.store", "agents.synth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

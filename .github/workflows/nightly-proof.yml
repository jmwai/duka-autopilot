name: Capture nightly proof

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose real nightly Job should run
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read

concurrency:
  group: nightly-proof-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  execute:
    name: Execute and capture Cloud Run Job evidence
    if: >-
      (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
      (inputs.environment == 'prod' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: ${{ inputs.environment == 'prod' && 'production' || 'development' }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Authenticate to the selected environment through WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.environment == 'prod' && vars.GCP_PROD_DEPLOYER_SA || vars.GCP_DEV_DEPLOYER_SA }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Execute the real nightly Job and wait for completion
        run: |
          JOB_NAME="duka-${TARGET_ENV}-nightly"
          gcloud run jobs execute "${JOB_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --wait --format=json > nightly-operation.json
          EXECUTION=$(gcloud run jobs executions list \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --job "${JOB_NAME}" --limit=1 \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)')
          test -n "${EXECUTION}"
          echo "EXECUTION=${EXECUTION}" >>"${GITHUB_ENV}"

      - name: Capture execution and correlated logs
        run: |
          gcloud run jobs executions describe "${EXECUTION}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --format=json > nightly-execution.json
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"duka-${TARGET_ENV}-nightly\" AND resource.labels.location=\"${REGION}\"" \
            --project "${PROJECT_ID}" --freshness=2h --limit=500 \
            --order=asc --format=json > nightly-logs.json
          test "$(jq 'length' nightly-logs.json)" -gt 0

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-proof-${{ inputs.environment }}-${{ github.sha }}
          path: |
            nightly-operation.json
            nightly-execution.json
            nightly-logs.json
          if-no-files-found: warn
          retention-days: 90

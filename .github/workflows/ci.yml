name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A direct CI run and this workflow called by a deployment are distinct
  # checks; they must not cancel one another for the same branch revision.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.12"
  UV_VERSION: "0.11.13"
  TERRAFORM_VERSION: "1.14.5"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  tests:
    name: Unit and Firestore parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv and Python
        run: |
          python3 -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv python install "${PYTHON_VERSION}"
          uv sync --locked --extra dev --python "${PYTHON_VERSION}"

      - name: Install Java 21 for the Firestore emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Firestore emulator
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          install_components: beta,cloud-firestore-emulator

      - name: Start the Firestore emulator
        run: |
          gcloud beta emulators firestore start \
            --host-port=127.0.0.1:8085 \
            --project=demo-duka \
            --quiet >"${RUNNER_TEMP}/firestore-emulator.log" 2>&1 &
          for _ in $(seq 1 30); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 8085), 1).close()"; then
              exit 0
            fi
            sleep 2
          done
          sed -n '1,240p' "${RUNNER_TEMP}/firestore-emulator.log"
          exit 1

      - name: Run every test with emulator parity enabled
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIRESTORE_DATABASE: "(default)"
          GOOGLE_CLOUD_PROJECT: demo-duka
        run: |
          uv run --frozen pytest -q -rs --junitxml=pytest.xml
          uv run --frozen python scripts/assert_junit.py pytest.xml --max-skipped 0

      - name: Check lock, imports, and durable topology contract
        run: |
          uv lock --check
          uv run --frozen python -m compileall -q agents app scripts tests
          uv run --frozen python scripts/check_compatibility.py

      - name: Audit candidate and reachable history for credentials and removed trailers
        run: uv run --frozen python scripts/prepush_audit.py

      - name: Upload deterministic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ github.sha }}
          path: |
            pytest.xml
            ${{ runner.temp }}/firestore-emulator.log
          if-no-files-found: warn
          retention-days: 30

  terraform:
    name: Workflow and Terraform schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify GitHub Actions workflow syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" \
            --repo rhysd/actionlint --pattern "${archive}"
          gh attestation verify --repo rhysd/actionlint "${archive}"
          tar -xzf "${archive}" actionlint
          ./actionlint -no-color

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Enforce canonical formatting
        run: terraform fmt -check -recursive deployment/terraform

      - name: Validate bootstrap module
        working-directory: deployment/terraform/bootstrap
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate

      - name: Validate application module
        working-directory: deployment/terraform/app
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate

  frontend:
    name: Next.js quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"

      - name: Activate the locked pnpm release
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install from the frozen lock
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, and build
        run: pnpm check

      - name: Capture bundle-budget evidence
        run: pnpm check:bundle > bundle-budget.json

      - name: Install the deterministic E2E backend
        run: |
          python3 -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          cd ..
          uv sync --locked --extra dev --python "${PYTHON_VERSION}"

      - name: Install the pinned Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production browser, accessibility, and mutation journeys
        run: pnpm test:e2e

      - name: Verify the meaningful bilingual judging profile
        run: pnpm test:e2e:judge

      - name: Upload frontend release-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-quality-${{ github.sha }}
          path: |
            frontend/bundle-budget.json
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 30

  containers:
    name: Reproducible container builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build backend image without publishing
        run: |
          docker build \
            --file deployment/docker/backend.Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag duka-backend:ci .

      - name: Build frontend image without publishing
        run: |
          docker build \
            --file deployment/docker/frontend.Dockerfile \
            --build-arg "RELEASE_SHA=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag duka-frontend:ci .

      - name: Smoke the paired non-root release containers
        run: |
          docker network create duka-ci
          docker run --detach --name duka-ci-api --network duka-ci \
            --env DUKA_ENV=local \
            --env DUKA_DB=/tmp/duka.db \
            --env RELEASE_SHA="${GITHUB_SHA}" \
            duka-backend:ci
          docker run --detach --name duka-ci-web --network duka-ci \
            --publish 18080:8080 \
            --env DUKA_ENV=local \
            --env DUKA_API_URL=http://duka-ci-api:8080 \
            --env RELEASE_SHA="${GITHUB_SHA}" \
            duka-frontend:ci
          python3 scripts/smoke_release.py \
            --url http://127.0.0.1:18080 \
            --release-sha "${GITHUB_SHA}"
          test "$(docker inspect --format '{{.Config.User}}' duka-ci-web)" = "10001:10001"

      - name: Clean up release smoke containers
        if: always()
        run: |
          docker rm --force duka-ci-web duka-ci-api 2>/dev/null || true
          docker network rm duka-ci 2>/dev/null || true
